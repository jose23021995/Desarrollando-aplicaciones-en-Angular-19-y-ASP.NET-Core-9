<form [formGroup]="form" (submit)="guardarCambios()">
    <mat-form-field appearance="outline">
        <mat-label>Nombre</mat-label>
        <input matInput [formControl]="form.controls.nombre"/>
        <mat-error>{{obtenerErrorCampoNombre()}}</mat-error>
    </mat-form-field>
    <mat-form-field appearance="outline">
        <mat-label>Fecha Nacimiento</mat-label>
        <input matInput [matDatepicker]="piker" [formControl]="form.controls.fechaNacimiento"/>
        <mat-datepicker #piker></mat-datepicker>
        <mat-datepicker-toggle matSuffix [for]="piker"></mat-datepicker-toggle>
        <mat-error>{{obtenerErrorFechaNacimiento()}}</mat-error>
    </mat-form-field>
    <div>

        <app-input-img titulo="Foto del Actor" 
        [urlImagenActual]="modelo?.foto" (archivoSeleccionado)="archivoSeleccionado($event)"></app-input-img>
    </div>
    <div class="contenedor-botones">
        <button type="submit" mat-flat-button [disabled]="form.invalid">Guardar cambios</button>
        <a routerLink="/actores" mat-stroked-button>Cancelar</a>
    </div>
</form>
