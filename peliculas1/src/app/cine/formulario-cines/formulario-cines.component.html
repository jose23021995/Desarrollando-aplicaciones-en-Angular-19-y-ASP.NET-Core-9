<form [formGroup]="form" (submit)="guardarCambios()">
    <mat-form-field appearance="outline">
        <mat-label>Nombre</mat-label>
        <input matInput [formControl]="form.controls.nombre"/>
        <mat-error>{{obtenerErrorCampoNombre()}}</mat-error>
    </mat-form-field>
    <h4>Seleccione la ubicacion del cine</h4>
   |<app-mapa (coordenadaSeleccionada)="coordenadaSeleccionada($event)" [coordenadasIniciales]="coordenadasIniciales"></app-mapa>
    <div class="contenedor-botones">
        <button type="submit" mat-flat-button [disabled]="form.invalid">Guardar cambios</button>
        <a routerLink="/cines" mat-stroked-button>Cancelar</a>
    </div>
</form>
