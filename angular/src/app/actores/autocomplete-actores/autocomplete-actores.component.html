<form>
    <mat-form-field>
        <input type="text" placeholder="Seleccione los actores" 
        matInput [formControl]="control" [matAutocomplete]="auto">
        <mat-autocomplete #auto (optionSelected)="actorSeleccionado($event)">
            @for (actor of actores; track $index) 
            {
                <mat-option [value]="actor">
                    <img [src]="actor.foto">
                    {{actor.nombre}}</mat-option>
            }
        </mat-autocomplete>
    </mat-form-field>
</form>
@if (actoresSeleccionados.length >0) {
    <table mat-table [dataSource]="actoresSeleccionados" class="mat-elevation-z8" cdkDropList [cdkDropListData]="actoresSeleccionados"
    (cdkDropListDropped)="finalizarArrastre($event)">
        <ng-cotainer matColumnDef="imagen">
            <td mat-cell *matCellDef="let element">
                <img src="" alt="" style="width: 50px;" [src]="element.foto" />
            </td>
        </ng-cotainer>
        <ng-cotainer matColumnDef="nombre">
            <td mat-cell *matCellDef="let actor">
                {{actor.nombre}}
            </td>
        </ng-cotainer>
        <ng-cotainer matColumnDef="personaje">
            <td mat-cell *matCellDef="let actor">
                <mat-form-field appearance="outline" style="margin: 10px 0 ;">
                    <mat-label>Personaje</mat-label>
                    <input matInput [(ngModel)]="actor.personaje">
                </mat-form-field>
            </td>
        </ng-cotainer>
        <ng-cotainer matColumnDef="accion">
            <td mat-cell *matCellDef="let actor">
                <mat-icon mat-list-icon (click)="eliminar(actor)">
                    close
                </mat-icon>
            </td>
        </ng-cotainer>
        <tr mat-row *matRowDef="let row; columns: columnasAMostrar" cdkDrag [cdkDragData]="row"></tr>
    </table>
}
